name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate.sh
      - run: bash -n install.sh bootstrap.sh
      - name: install into temp targets
        run: |
          SKILLS_TARGETS="$RUNNER_TEMP/a:$RUNNER_TEMP/b" ./install.sh
          SKILLS_TARGETS="$RUNNER_TEMP/a:$RUNNER_TEMP/b" ./install.sh
          SKILLS_TARGETS="$RUNNER_TEMP/a:$RUNNER_TEMP/b" ./install.sh --uninstall
